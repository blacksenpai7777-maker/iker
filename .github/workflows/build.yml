name: apk
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Proyecto
        run: |
          mkdir -p app/src/main/java/com/ovltools/core
          mkdir -p app/src/main/res/values app/src/main/res/xml
          mkdir -p app/src/main/res/layout app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/assets tools

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ovltools"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          val ksFile = rootProject.file("keystore/release.jks")
          android {
              namespace = "com.ovltools.core"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ovltools.core"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("rel") {
                      storeFile = ksFile
                      storePassword = "android"
                      keyAlias = "ovl"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  release { isMinifyEnabled = false; signingConfig = signingConfigs.getByName("rel") }
                  debug { signingConfig = signingConfigs.getByName("rel") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              androidResources { noCompress += "tflite" }
              packaging { resources.excludes += setOf("META-INF/AL2.0", "META-INF/LGPL2.1") }
              lint { abortOnError = false }
          }
          tasks.register("genKeystore") {
              onlyIf { !ksFile.exists() }
              doLast {
                  ksFile.parentFile.mkdirs()
                  exec {
                      commandLine("keytool", "-genkeypair", "-keystore", ksFile.absolutePath,
                          "-storepass", "android", "-keypass", "android", "-alias", "ovl",
                          "-keyalg", "RSA", "-keysize", "2048", "-validity", "12000",
                          "-dname", "CN=Overlay Tools, O=ovl, C=ES")
                  }
              }
          }
          tasks.named("preBuild") { dependsOn("genKeystore") }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.tensorflow:tensorflow-lite:2.16.1")
              implementation("org.tensorflow:tensorflow-lite-gpu:2.16.1")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          -keep class org.tensorflow.lite.** { *; }
          -keep class rikka.shizuku.** { *; }
          -dontwarn org.tensorflow.**
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries><package android:name="moe.shizuku.privileged.api" /></queries>
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name" android:supportsRtl="true" android:theme="@style/Theme.Ovl">
                  <activity android:name=".OnboardActivity" android:exported="true"
                      android:screenOrientation="fullSensor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false" android:screenOrientation="fullSensor" />
                  <activity android:name=".CalibrateActivity" android:exported="false"
                      android:screenOrientation="fullSensor" android:theme="@style/Theme.Ovl.Transparent" />
                  <service android:name=".OverlayService" android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <service android:name=".AimAccessibilityService" android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="0" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Overlay Tools</string>
              <string name="ch_name">Servicio</string>
              <string name="n_title">Overlay Tools</string>
              <string name="n_text">Captura activa</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#FF12161A</color>
              <color name="fg">#FFDDE5EC</color>
              <color name="acc">#FF00E676</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Ovl" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
              </style>
              <style name="Theme.Ovl.Transparent" parent="Theme.Ovl">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#3A3E44" android:pathData="M20,20h68v68h-68z" />
              <path android:strokeColor="#CDD2D8" android:strokeWidth="3" android:fillColor="#00000000"
                  android:pathData="M54,30 L54,42 M54,66 L54,78 M30,54 L42,54 M66,54 L78,54" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_stat.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2 L12,7 M12,17 L12,22 M2,12 L7,12 M17,12 L22,12" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          echo "recursos ok"- name: Codigo
    run: |
      cat > app/src/main/java/com/ovltools/core/Cfg.kt <<'EOF'
      package com.ovltools.core
      import android.content.Context
      object Cfg {
          @Volatile var enabled = true
          @Volatile var fov = 200
          @Volatile var smoothMsPerPx = 0.62f
          @Volatile var reactionMs = 120
          @Volatile var jitter = 2f
          @Volatile var aimPoint = 0
          @Volatile var mode = 0
          @Volatile var fps = 20
          @Volatile var conf = 0.40f
          @Volatile var gain = 1.0f
          @Volatile var deadZone = 5f
          @Volatile var anchorFx = 0.5f
          @Volatile var anchorFy = 0.5f
          @Volatile var showBoxes = true
          private const val P = "ovl"
          fun load(c: Context) {
              val s = c.getSharedPreferences(P, Context.MODE_PRIVATE)
              enabled = s.getBoolean("enabled", true)
              fov = s.getInt("fov", 200)
              smoothMsPerPx = s.getFloat("smooth", 0.62f)
              reactionMs = s.getInt("reaction", 120)
              jitter = s.getFloat("jitter", 2f)
              aimPoint = s.getInt("aim", 0)
              mode = s.getInt("mode", 0)
              fps = s.getInt("fps", 20)
              conf = s.getFloat("conf", 0.40f)
              gain = s.getFloat("gain", 1.0f)
              deadZone = s.getFloat("dead", 5f)
              anchorFx = s.getFloat("afx", 0.5f)
              anchorFy = s.getFloat("afy", 0.5f)
              showBoxes = s.getBoolean("boxes", true)
          }
          fun save(c: Context) {
              c.getSharedPreferences(P, Context.MODE_PRIVATE).edit()
                  .putBoolean("enabled", enabled).putInt("fov", fov).putFloat("smooth", smoothMsPerPx)
                  .putInt("reaction", reactionMs).putFloat("jitter", jitter).putInt("aim", aimPoint)
                  .putInt("mode", mode).putInt("fps", fps).putFloat("conf", conf).putFloat("gain", gain)
                  .putFloat("dead", deadZone).putFloat("afx", anchorFx).putFloat("afy", anchorFy)
                  .putBoolean("boxes", showBoxes).apply()
          }
      }
      EOF

      cat > app/src/main/java/com/ovltools/core/Diag.kt <<'EOF'
