      cat > app/src/main/java/com/ovltools/core/OnboardActivity.kt <<'EOF'
      package com.ovltools.core
      import android.Manifest
      import android.content.Intent
      import android.content.pm.PackageManager
      import android.net.Uri
      import android.os.Build
      import android.os.Bundle
      import android.provider.Settings
      import android.widget.Button
      import android.widget.TextView
      import androidx.appcompat.app.AppCompatActivity
      import androidx.core.app.ActivityCompat
      import androidx.core.content.ContextCompat
      class OnboardActivity : AppCompatActivity() {
          private var step = 0
          private lateinit var title: TextView
          private lateinit var body: TextView
          private lateinit var action: Button
          private lateinit var next: Button
          private lateinit var state: TextView
          private val titles = arrayOf("Superposicion", "Accesibilidad", "Captura de pantalla")
          private val bodies = arrayOf(
              "Dibuja el circulo de punteria sobre el juego.",
              "Permite enviar el gesto de apuntado.",
              "Lee solo la imagen de pantalla, nunca la memoria del juego.")
          override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              if (Build.VERSION.SDK_INT >= 33 &&
                  ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                  ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 7)
              setContentView(R.layout.activity_onboard)
              title = findViewById(R.id.obTitle)
              body = findViewById(R.id.obBody)
              action = findViewById(R.id.obAction)
              next = findViewById(R.id.obNext)
              state = findViewById(R.id.obState)
              action.setOnClickListener {
                  when (step) {
                      0 -> startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      1 -> startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      else -> open()
                  }
              }
              next.setOnClickListener { if (step < 2) { step++; render() } else open() }
              render()
          }
          private fun open() {
              startActivity(Intent(this, MainActivity::class.java)); finish()
          }
          private fun render() {
              title.text = titles[step]
              body.text = bodies[step]
              action.text = when (step) {
                  0 -> "Abrir ajuste de superposicion"
                  1 -> "Abrir ajuste de accesibilidad"
                  else -> "Continuar"
              }
              next.text = if (step < 2) "Saltar / Siguiente" else "Entrar"
          }
          override fun onResume() {
              super.onResume()
              val ok = when (step) {
                  0 -> Settings.canDrawOverlays(this)
                  1 -> AimAccessibilityService.alive()
                  else -> true
              }
              state.text = if (ok) "Estado: concedido" else "Estado: pendiente"
          }
      }
      EOF

      cat > app/src/main/java/com/ovltools/core/CalibrateActivity.kt <<'EOF'
      package com.ovltools.core
      import android.os.Bundle
      import android.view.MotionEvent
      import android.view.View
      import android.widget.Button
      import android.widget.TextView
      import androidx.appcompat.app.AppCompatActivity
      import kotlin.math.hypot
      class CalibrateActivity : AppCompatActivity() {
          private var fx = -1f
          private var fy = -1f
          private lateinit var info: TextView
          override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              setContentView(R.layout.activity_calibrate)
              info = findViewById(R.id.calInfo)
              val area = findViewById<View>(R.id.calArea)
              area.setOnTouchListener { _, e ->
                  if (e.actionMasked == MotionEvent.ACTION_UP) {
                      if (fx < 0f) {
                          fx = e.x; fy = e.y
                          info.text = "Punto marcado. Pulsa ENVIAR GESTO y vuelve a tocar el MISMO punto."
                      } else {
                          val d = hypot(e.x - fx, e.y - fy)
                          if (d < 20f) info.text = "Muy corto. Repite."
                          else {
                              val g = (d / 200f).coerceIn(0.2f, 3f)
                              Cfg.gain = g; Cfg.save(this)
                              info.text = "Ganancia %.2f guardada.".format(g)
                              fx = -1f
                          }
                      }
                  }
                  true
              }
              findViewById<Button>(R.id.calSend).setOnClickListener {
                  if (fx < 0f) { info.text = "Toca primero un punto fijo."; return@setOnClickListener }
                  val inj = AimAccessibilityService.instance?.injector
                  if (inj == null) { info.text = "Accesibilidad no activa."; return@setOnClickListener }
                  val cx = resources.displayMetrics.widthPixels / 2f
                  val cy = resources.displayMetrics.heightPixels / 2f
                  inj.setStart(cx, cy)
                  inj.queue(200f, 0f, 120)
                  info.text = "Gesto enviado. Vuelve a tocar el MISMO punto del mapa."
              }
              findViewById<Button>(R.id.calReset).setOnClickListener {
                  Cfg.gain = 1f; Cfg.save(this); fx = -1f
                  info.text = "Ganancia a 1.00."
              }
              findViewById<Button>(R.id.calClose).setOnClickListener { finish() }
              info.text = "1) Toca un punto fijo. 2) Envia el gesto. 3) Toca el mismo punto."
          }
      }
      EOF

      cat > app/src/main/java/com/ovltools/core/MainActivity.kt <<'EOF'
      package com.ovltools.core
      import android.app.Activity
      import android.content.Intent
      import android.media.projection.MediaProjectionManager
      import android.net.Uri
      import android.os.Build
      import android.os.Bundle
      import android.os.Handler
      import android.os.Looper
      import android.provider.Settings
      import android.widget.*
      import androidx.appcompat.app.AppCompatActivity
      class MainActivity : AppCompatActivity() {
          private lateinit var status: TextView
          private val ui = Handler(Looper.getMainLooper())
          private var mute = false
          override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              setContentView(R.layout.activity_main)
              Cfg.load(this)
              status = findViewById(R.id.status)
              findViewById<Button>(R.id.btnStart).setOnClickListener { start() }
              findViewById<Button>(R.id.btnStop).setOnClickListener {
                  stopService(Intent(this, OverlayService::class.java)); refresh()
              }
              findViewById<Button>(R.id.btnCalib).setOnClickListener {
                  startActivity(Intent(this, CalibrateActivity::class.java))
              }
              findViewById<Button>(R.id.btnOverlay).setOnClickListener {
                  startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
              }
              findViewById<Button>(R.id.btnAcc).setOnClickListener {
                  startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
              }
              findViewById<Button>(R.id.btnSaveP).setOnClickListener {
                  val n = findViewById<EditText>(R.id.etProfile).text.toString().trim()
                  if (n.isNotEmpty()) { ProfileStore.save(this, n); Toast.makeText(this, "Guardado", Toast.LENGTH_SHORT).show() }
              }
              findViewById<Button>(R.id.btnLoadP).setOnClickListener {
                  val n = findViewById<EditText>(R.id.etProfile).text.toString().trim()
                  if (ProfileStore.load(this, n)) { mute = true; recreate() }
              }
              findViewById<Button>(R.id.btnDelP).setOnClickListener {
                  val n = findViewById<EditText>(R.id.etProfile).text.toString().trim()
                  ProfileStore.delete(this, n)
              }
              findViewById<Button>(R.id.btnExp).setOnClickListener {
                  startActivityForResult(Intent(Intent.ACTION_CREATE_DOCUMENT)
                      .setType("application/json").putExtra(Intent.EXTRA_TITLE, "ovl.json"), 21)
              }
              findViewById<Button>(R.id.btnImp).setOnClickListener {
                  startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).setType("*/*"), 22)
              }
              bind()
              ui.post(tick)
          }
          private fun bind() {
              sb(R.id.sbFov, 520, Cfg.fov - 80) { Cfg.fov = 80 + it }
              sb(R.id.sbSmooth, 130, (Cfg.smoothMsPerPx * 100).toInt() - 20) { Cfg.smoothMsPerPx = (it + 20) / 100f }
              sb(R.id.sbReact, 200, Cfg.reactionMs - 60) { Cfg.reactionMs = it + 60 }
              sb(R.id.sbJitter, 60, (Cfg.jitter * 10).toInt()) { Cfg.jitter = it / 10f }
              sb(R.id.sbConf, 75, (Cfg.conf * 100).toInt() - 15) { Cfg.conf = (it + 15) / 100f }
              sb(R.id.sbFps, 25, Cfg.fps - 5) { Cfg.fps = it + 5 }
              sb(R.id.sbGain, 180, (Cfg.gain * 100).toInt() - 40) { Cfg.gain = (it + 40) / 100f }
              sp(R.id.spAim, listOf("Cabeza", "Cuello", "Pecho"), Cfg.aimPoint) { Cfg.aimPoint = it }
              sp(R.id.spMode, listOf("Mantener boton", "Siempre"), Cfg.mode) { Cfg.mode = it }
              val sw = findViewById<Switch>(R.id.swBoxes)
              sw.isChecked = Cfg.showBoxes
              sw.setOnCheckedChangeListener { _, v -> if (!mute) { Cfg.showBoxes = v; Cfg.save(this) } }
          }
          private fun sb(id: Int, max: Int, prog: Int, f: (Int) -> Unit) {
              val s = findViewById<SeekBar>(id)
              s.max = max; s.progress = prog.coerceIn(0, max)
              s.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(x: SeekBar?, p: Int, u: Boolean) {
                      if (!mute) { f(p); Cfg.save(this@MainActivity) }
                  }
                  override fun onStartTrackingTouch(x: SeekBar?) {}
                  override fun onStopTrackingTouch(x: SeekBar?) {}
              })
          }
          private fun sp(id: Int, items: List<String>, sel: Int, f: (Int) -> Unit) {
              val s = findViewById<Spinner>(id)
              s.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, items)
              s.setSelection(sel.coerceIn(0, items.size - 1))
              s.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                  override fun onItemSelected(a: AdapterView<*>?, v: android.view.View?, p: Int, i: Long) {
                      if (!mute) { f(p); Cfg.save(this@MainActivity) }
                  }
                  override fun onNothingSelected(a: AdapterView<*>?) {}
              }
          }
          private fun start() {
              if (!Settings.canDrawOverlays(this)) { Toast.makeText(this, "Falta superposicion", Toast.LENGTH_SHORT).show(); return }
              if (!AimAccessibilityService.alive()) { Toast.makeText(this, "Activa accesibilidad", Toast.LENGTH_SHORT).show(); return }
              val m = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
              startActivityForResult(m.createScreenCaptureIntent(), 20)
          }
          @Deprecated("Deprecated in Java")
          override fun onActivityResult(r: Int, res: Int, d: Intent?) {
              super.onActivityResult(r, res, d)
              when (r) {
                  20 -> {
                      if (res != Activity.RESULT_OK || d == null) return
                      val i = Intent(this, OverlayService::class.java)
                          .setAction(OverlayService.A_START)
                          .putExtra(OverlayService.E_CODE, res)
                          .putExtra(OverlayService.E_DATA, d)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                      Toast.makeText(this, "Activo", Toast.LENGTH_SHORT).show()
                  }
                  21 -> d?.data?.let { u ->
                      runCatching { contentResolver.openOutputStream(u)?.use { it.write(ProfileStore.exportJson().toByteArray()) } }
                  }
                  22 -> d?.data?.let { u ->
                      runCatching {
                          val t = contentResolver.openInputStream(u)?.bufferedReader()?.use { it.readText() } ?: ""
                          if (ProfileStore.importJson(this, t)) { mute = true; recreate() }
                      }
                  }
              }
          }
          private val tick = object : Runnable {
              override fun run() { refresh(); ui.postDelayed(this, 700) }
          }
          private fun refresh() {
              val ov = if (Settings.canDrawOverlays(this)) "ok" else "falta"
              val ac = if (AimAccessibilityService.alive()) "ok" else "falta"
              val st = if (OverlayService.running) "activo" else "parado"
              status.text = "Overlay: $ov - Accesibilidad: $ac - Servicio: $st\n" +
                  "Modelo: ${Diag.model} (${Diag.backend})\n" +
                  "Inferencia ${"%.0f".format(Diag.infMs)} ms - Obj ${Diag.targets} - ${Diag.state}"
          }
          override fun onResume() { super.onResume(); refresh() }
          override fun onDestroy() { ui.removeCallbacksAndMessages(null); super.onDestroy() }
      }
