                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT)
                  lpc.gravity = Gravity.TOP or Gravity.START
                  wm.addView(host, lpc)
                  canvas = cv
                  val av = AnchorView(this)
                  val d = resources.displayMetrics.density
                  val lpa = WindowManager.LayoutParams((28 * d).toInt(), (28 * d).toInt(),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT)
                  lpa.gravity = Gravity.TOP or Gravity.START
                  lpa.x = (Cfg.anchorFx * sw - 14 * d).toInt()
                  lpa.y = (Cfg.anchorFy * sh - 14 * d).toInt()
                  wm.addView(av, lpa)
                  anchor = av
                  val pv = PanelView(this)
                  pv.onFov = { x -> Cfg.fov = (Cfg.fov + x).coerceIn(80, 600); pv.refresh() }
                  pv.onSmooth = { x -> Cfg.smoothMsPerPx = ((Cfg.smoothMsPerPx * 100).toInt() + x).coerceIn(20, 150) / 100f; pv.refresh() }
                  pv.onReact = { x -> Cfg.reactionMs = (Cfg.reactionMs + x).coerceIn(60, 260); pv.refresh() }
                  pv.onAim = { Cfg.aimPoint = (Cfg.aimPoint + 1) % 3; pv.refresh() }
                  pv.onMode = { Cfg.mode = (Cfg.mode + 1) % 2; pv.refresh() }
                  pv.onHold = { h -> holdPressed = h }
                  pv.onCalibrate = { startActivity(Intent(this, CalibrateActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                  pv.onSettings = { startActivity(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                  pv.onStop = { Cfg.save(this); stopSelf() }
                  val lpp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                  lpp.gravity = Gravity.TOP or Gravity.START
                  lpp.x = 18; lpp.y = 90
                  wm.addView(pv, lpp)
                  panel = pv
                  var dx = 0; var dy = 0
                  pv.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = lpp.x - e.rawX.toInt(); dy = lpp.y - e.rawY.toInt(); false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lpp.x = e.rawX.toInt() + dx; lpp.y = e.rawY.toInt() + dy
                              try { wm.updateViewLayout(v, lpp) } catch (_: Throwable) {}
                              false
                          }
                          else -> false
                      }
                  }
              }
              private fun removeWindows() {
                  try { panel?.let { wm.removeView(it) } } catch (_: Throwable) {}
                  try { anchor?.let { wm.removeView(it) } } catch (_: Throwable) {}
                  try { canvas?.let { wm.removeView(it.parent as View) } } catch (_: Throwable) {}
                  panel = null; anchor = null; canvas = null
              }
              override fun onDestroy() {
                  running = false
                  Cfg.save(this)
                  try { loop.removeCallbacksAndMessages(null) } catch (_: Throwable) {}
                  try { unregisterReceiver(srecv) } catch (_: Throwable) {}
                  try { (getSystemService(DISPLAY_SERVICE) as DisplayManager).unregisterDisplayListener(dlist) } catch (_: Throwable) {}
                  stopCapture()
                  try { proj?.stop() } catch (_: Throwable) {}
                  removeWindows()
                  bg.quitSafely()
                  Diag.state = "parado"
                  super.onDestroy()
              }
          }
          EOF
          echo "servicio ok"- name: Actividades
