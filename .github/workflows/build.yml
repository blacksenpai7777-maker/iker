      cat > app/src/main/java/com/ovltools/core/ProfileStore.kt <<'EOF'
      package com.ovltools.core
      import android.content.Context
      import org.json.JSONObject
      import java.io.File
      object ProfileStore {
          private fun dir(c: Context) = File(c.filesDir, "profiles").apply { mkdirs() }
          fun list(c: Context): List<String> =
              dir(c).listFiles()?.filter { it.name.endsWith(".json") }?.map { it.name.removeSuffix(".json") }?.sorted() ?: emptyList()
          fun save(c: Context, name: String) {
              val o = JSONObject()
              o.put("fov", Cfg.fov); o.put("smooth", Cfg.smoothMsPerPx.toDouble())
              o.put("reaction", Cfg.reactionMs); o.put("jitter", Cfg.jitter.toDouble())
              o.put("aim", Cfg.aimPoint); o.put("mode", Cfg.mode); o.put("fps", Cfg.fps)
              o.put("conf", Cfg.conf.toDouble()); o.put("gain", Cfg.gain.toDouble())
              o.put("dead", Cfg.deadZone.toDouble())
              File(dir(c), name.filter { it.isLetterOrDigit() || it == '_' || it == '-' } + ".json").writeText(o.toString(2))
          }
          fun load(c: Context, name: String): Boolean {
              val f = File(dir(c), "$name.json")
              if (!f.exists()) return false
              return try {
                  val o = JSONObject(f.readText())
                  Cfg.fov = o.optInt("fov", Cfg.fov)
                  Cfg.smoothMsPerPx = o.optDouble("smooth", Cfg.smoothMsPerPx.toDouble()).toFloat()
                  Cfg.reactionMs = o.optInt("reaction", Cfg.reactionMs)
                  Cfg.jitter = o.optDouble("jitter", Cfg.jitter.toDouble()).toFloat()
                  Cfg.aimPoint = o.optInt("aim", Cfg.aimPoint)
                  Cfg.mode = o.optInt("mode", Cfg.mode)
                  Cfg.fps = o.optInt("fps", Cfg.fps)
                  Cfg.conf = o.optDouble("conf", Cfg.conf.toDouble()).toFloat()
                  Cfg.gain = o.optDouble("gain", Cfg.gain.toDouble()).toFloat()
                  Cfg.deadZone = o.optDouble("dead", Cfg.deadZone.toDouble()).toFloat()
                  Cfg.save(c); true
              } catch (_: Throwable) { false }
          }
          fun delete(c: Context, name: String) { File(dir(c), "$name.json").delete() }
          fun exportJson(): String {
              val o = JSONObject()
              o.put("fov", Cfg.fov); o.put("smooth", Cfg.smoothMsPerPx.toDouble())
              o.put("reaction", Cfg.reactionMs); o.put("jitter", Cfg.jitter.toDouble())
              o.put("aim", Cfg.aimPoint); o.put("mode", Cfg.mode); o.put("fps", Cfg.fps)
              o.put("conf", Cfg.conf.toDouble()); o.put("gain", Cfg.gain.toDouble())
              return o.toString(2)
          }
          fun importJson(c: Context, t: String): Boolean = try {
              val o = JSONObject(t)
              Cfg.fov = o.optInt("fov", Cfg.fov)
              Cfg.smoothMsPerPx = o.optDouble("smooth", Cfg.smoothMsPerPx.toDouble()).toFloat()
              Cfg.reactionMs = o.optInt("reaction", Cfg.reactionMs)
              Cfg.jitter = o.optDouble("jitter", Cfg.jitter.toDouble()).toFloat()
              Cfg.aimPoint = o.optInt("aim", Cfg.aimPoint)
              Cfg.mode = o.optInt("mode", Cfg.mode)
              Cfg.fps = o.optInt("fps", Cfg.fps)
              Cfg.conf = o.optDouble("conf", Cfg.conf.toDouble()).toFloat()
              Cfg.gain = o.optDouble("gain", Cfg.gain.toDouble()).toFloat()
              Cfg.save(c); true
          } catch (_: Throwable) { false }
      }
      EOF

      cat > app/src/main/java/com/ovltools/core/Detector.kt <<'EOF'
      package com.ovltools.core
      import android.content.Context
      import android.graphics.Bitmap
      import android.graphics.Canvas
      import org.tensorflow.lite.DataType
      import org.tensorflow.lite.Interpreter
      import org.tensorflow.lite.gpu.CompatibilityList
      import org.tensorflow.lite.gpu.GpuDelegate
      import java.io.FileInputStream
      import java.nio.ByteBuffer
      import java.nio.ByteOrder
      import java.nio.channels.FileChannel
      data class Det(val cx: Float, val cy: Float, val w: Float, val h: Float, val score: Float)
      class Detector(private val ctx: Context) {
          private var itp: Interpreter? = null
          private var gpu: GpuDelegate? = null
          var ready = false; private set
          var backend = "-"; private set
          var error = ""; private set
          private var inW = 320
          private var inH = 320
          private var quantIn = false
          private var inScale = 1f
          private var inZero = 0
          fun init() {
              close(); error = ""
              val buf = load("aim_v8n_int8.tflite")
              if (buf == null) { error = "asset ausente"; return }
              val opts = Interpreter.Options()
              val compat = CompatibilityList()
              if (compat.isDelegateSupportedOnThisDevice) {
                  try {
                      gpu = GpuDelegate(GpuDelegate.Options().setQuantizedModelsAllowed(true))
                      opts.addDelegate(gpu); backend = "GPU"
                  } catch (_: Throwable) { gpu = null }
              }
              if (gpu == null) { opts.setNumThreads(4); opts.setUseXNNPACK(true); backend = "XNNPACK" }
              val i = try { Interpreter(buf, opts) } catch (_: Throwable) {
                  try { Interpreter(buf) } catch (_: Throwable) { error = "modelo ilegible"; return }
              }
              itp = i
              val t = i.getInputTensor(0)
              inH = t.shape()[1]; inW = t.shape()[2]
              quantIn = t.dataType() == DataType.UINT8
              if (quantIn) { inScale = t.quantizationParams().scale; inZero = t.quantizationParams().zeroPoint }
              ready = true
          }
          fun close() {
              ready = false
              try { itp?.close() } catch (_: Throwable) {}
              try { gpu?.close() } catch (_: Throwable) {}
              itp = null; gpu = null
          }
          private fun load(n: String): ByteBuffer? = try {
              val fd = ctx.assets.openFd(n)
              FileInputStream(fd.fileDescriptor).use { fis ->
                  fis.channel.map(FileChannel.MapMode.READ_ONLY, fd.startOffset, fd.declaredLength)
              }
          } catch (_: Throwable) { null }
          fun infer(crop: Bitmap, conf: Float, hudTop: Int, mini: Int): List<Det> {
              val i = itp ?: return emptyList()
              if (!ready) return emptyList()
              val bw = crop.width; val bh = crop.height
              if (bw < 8 || bh < 8) return emptyList()
              val s = minOf(inW.toFloat() / bw, inH.toFloat() / bh)
              val dw = (bw * s).toInt().coerceAtLeast(1)
              val dh = (bh * s).toInt().coerceAtLeast(1)
              val ox = (inW - dw) / 2
              val oy = (inH - dh) / 2
              val sc = Bitmap.createScaledBitmap(crop, dw, dh, true)
              val cv = Bitmap.createBitmap(inW, inH, Bitmap.Config.ARGB_8888)
              cv.eraseColor(0xFF727272.toInt())
              Canvas(cv).drawBitmap(sc, ox.toFloat(), oy.toFloat(), null)
              sc.recycle()
              val px = IntArray(inW * inH)
              cv.getPixels(px, 0, inW, 0, 0, inW, inH)
              cv.recycle()
              val qb = ByteBuffer.allocateDirect(inW * inH * 3).order(ByteOrder.nativeOrder())
              val fb = ByteBuffer.allocateDirect(inW * inH * 3 * 4).order(ByteOrder.nativeOrder())
              for (p in px) {
                  for (c in intArrayOf((p shr 16) and 0xFF, (p shr 8) and 0xFF, p and 0xFF)) {
                      if (quantIn) qb.put((c / 255f / inScale + inZero).toInt().coerceIn(0, 255).toByte())
                      else fb.putFloat(c / 255f)
                  }
              }
              qb.rewind(); fb.rewind()
              val shape = i.getOutputTensor(0).shape()
              var c1 = shape[1]; var n1 = shape[2]; var tr = false
              if (c1 > n1) { val t = c1; c1 = n1; n1 = t; tr = true }
              val out = Array(1) { Array(c1) { FloatArray(n1) } }
              try { i.run(if (quantIn) qb else fb, out) } catch (_: Throwable) { return emptyList() }
              val nc = c1 - 4
              if (nc < 1) return emptyList()
              val raw = ArrayList<Det>(64)
              for (idx in 0 until n1) {
                  var best = 0f; var bc = 0
                  for (c in 0 until nc) {
                      val v = if (tr) out[0][idx][4 + c] else out[0][4 + c][idx]
                      if (v > best) { best = v; bc = c }
                  }
                  if (bc != 0 || best < conf) continue
                  val w = if (tr) out[0][idx][2] else out[0][2][idx]
                  val h = if (tr) out[0][idx][3] else out[0][3][idx]
                  if (h < 8f || w < 3f) continue
                  val ar = h / w
                  if (ar < 1.15f || ar > 6.5f) continue
                  val cx = if (tr) out[0][idx][0] else out[0][0][idx]
                  val cy = if (tr) out[0][idx][1] else out[0][1][idx]
                  val x = (cx - w / 2f - ox) / s
                  val y = (cy - h / 2f - oy) / s
                  val ww = w / s; val hh = h / s
                  if (y + hh < hudTop) continue
                  if (x + ww < mini && y + hh < mini) continue
                  raw.add(Det(x + ww / 2f, y + hh / 2f, ww, hh, best))
              }
              return nms(raw).take(12)
          }
          private fun nms(l: List<Det>): List<Det> {
              val o = ArrayList<Det>()
              for (d in l.sortedByDescending { it.score }) {
                  var drop = false
                  for (k in o) {
                      val iw = minOf(d.cx + d.w / 2, k.cx + k.w / 2) - maxOf(d.cx - d.w / 2, k.cx - k.w / 2)
                      val ih = minOf(d.cy + d.h / 2, k.cy + k.h / 2) - maxOf(d.cy - d.h / 2, k.cy - k.h / 2)
                      if (iw <= 0 || ih <= 0) continue
                      val inter = iw * ih
                      if (inter / (d.w * d.h + k.w * k.h - inter) > 0.45f) { drop = true; break }
                  }
                  if (!drop) o.add(d)
              }
              return o
          }
      }
      EOF

      cat > app/src/main/java/com/ovltools/core/Aimer.kt <<'EOF'
      package com.ovltools.core
      import kotlin.math.hypot
      import kotlin.random.Random
      data class Shot(val dx: Float, val dy: Float, val ms: Int)
      class Aimer {
          private var lx = 0f
          private var ly = 0f
          private var lh = 0f
          private var seen = 0L
          private var phase = 0
          private var tStart = 0L
          private var tFire = 0L
          private var prev = 0f
          private var over = false
          private var jx = 0f
          private var jy = 0f
          fun reset() { phase = 0; seen = 0L }
          private fun tgt(d: Det): FloatArray {
              val y = when (Cfg.aimPoint) {
                  0 -> d.cy - d.h * 0.37f
                  1 -> d.cy - d.h * 0.26f
                  else -> d.cy - d.h * 0.10f
              }
              return floatArrayOf(d.cx, y)
          }
          private fun matches(d: Det) = hypot(d.cx - lx, d.cy - ly) <= maxOf(30f, lh * 0.6f)
          private fun ease(t: Float): Float {
              val x = t.coerceIn(0f, 1f)
              return 1f - (1f - x) * (1f - x) * (1f - x)
          }
          fun step(dets: List<Det>, ax: Float, ay: Float, now: Long, active: Boolean): Shot? {
              if (!active) { reset(); return null }
              val c = dets.map { it to tgt(it) }
                  .map { Triple(it.first, it.second, hypot(it.second[0] - ax, it.second[1] - ay)) }
                  .filter { it.third <= Cfg.fov }
              if (c.isEmpty()) { if (phase != 0 && now - seen > 300) reset(); return null }
              val hit = c.firstOrNull { matches(it.first) }
              val t = hit ?: c.minByOrNull { it.third }!!
              if (hit != null) { seen = now; lx = t.first.cx; ly = t.first.cy; lh = t.first.h }
              else {
                  lx = t.first.cx; ly = t.first.cy; lh = t.first.h; seen = now
                  phase = 1; tFire = now + Cfg.reactionMs
                  jx = (Random.nextFloat() - 0.5f) * Cfg.jitter
                  jy = (Random.nextFloat() - 0.5f) * Cfg.jitter
                  prev = 0f; over = false
              }
              val ex = t.second[0] + jx - ax
              val ey = t.second[1] + jy - ay
              val err = hypot(ex, ey)
              if (err <= Cfg.deadZone && phase == 3) return null
              if (now < tFire) return null
              if (phase == 1) { phase = 2; tStart = now; prev = 0f }
              var mx = 0f; var my = 0f
              when (phase) {
                  2 -> {
                      val dur = ((0.05f + 0.4f * Cfg.smoothMsPerPx) * (0.6f + minOf(1.6f, err / 400f)) * 1000f).toLong()
                      val p = ((now - tStart).toFloat() / maxOf(dur, 20L)).coerceIn(0f, 1f)
                      val f = ease(p) - ease(prev)
                      prev = p; mx = ex * f; my = ey * f
                      if (p >= 1f) {
                          if (err > 3f) { tStart = now; prev = 0f }
                          else {
                              phase = 3; over = true
                              val n = if (err < 0.01f) 1f else err
                              mx += ex / n * (1f + Random.nextFloat() * 2f)
                              my += ey / n * (1f + Random.nextFloat() * 2f)
                          }
                      }
                  }
                  3 -> {
                      val g = if (over) 0.55f else 0.28f
                      over = false
                      mx = ex * g + (Random.nextFloat() - 0.5f)
                      my = ey * g + (Random.nextFloat() - 0.5f)
                      if (err < 0.7f) { mx = 0f; my = 0f }
                  }
                  else -> return null
              }
              if (mx == 0f && my == 0f) return null
              val g = Cfg.gain.coerceAtLeast(0.2f)
              val dx = mx / g; val dy = my / g
              val d = hypot(dx, dy)
              if (d < 0.7f) return null
              return Shot(dx, dy, (d * Cfg.smoothMsPerPx).toInt().coerceIn(40, 220))
          }
      }
