                  val sd = dets.map { Det((it.cx + l) / s, (it.cy + t) / s, it.w / s, it.h / s, it.score) }
                  cv?.setActive(active)
                  cv?.setBoxes(sd.map {
                      floatArrayOf(it.cx - it.w / 2, it.cy - it.h / 2, it.cx + it.w / 2, it.cy + it.h / 2)
                  })
                  val shot = aimer.step(sd, ax, ay, SystemClock.uptimeMillis(), active)
                  Diag.locked = shot != null
                  Diag.state = if (active) "apuntando" else "listo"
                  if (shot != null) {
                      if (ShizukuInjector.ready) {
                          ShizukuInjector.down(ax, ay)
                          ShizukuInjector.move(ax + shot.dx, ay + shot.dy)
                          ShizukuInjector.up(ax + shot.dx, ay + shot.dy)
                      } else {
