          package com.ovltools.core
          import android.content.pm.PackageManager
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.InputDevice
          import android.view.MotionEvent
          import rikka.shizuku.Shizuku
          import rikka.shizuku.ShizukuBinderWrapper
          import rikka.shizuku.SystemServiceHelper
          import java.lang.reflect.Method
          object ShizukuInjector {
              private var proxy: Any? = null
              private var method: Method? = null
              @Volatile var ready = false; private set
              fun init(): Boolean {
                  ready = false
                  if (!Shizuku.pingBinder()) return false
                  if (Shizuku.isPreV11()) return false
                  if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) return false
                  return try {
                      val b: IBinder = SystemServiceHelper.getSystemService("input") ?: return false
                      val stub = Class.forName("android.hardware.input.IInputManager\$Stub")
                      val asI = stub.getMethod("asInterface", IBinder::class.java)
                      proxy = asI.invoke(null, ShizukuBinderWrapper(b)) ?: return false
                      method = proxy!!.javaClass.getMethod("injectInputEvent",
                          android.view.InputEvent::class.java, Int::class.javaPrimitiveType)
                      ready = true; true
                  } catch (_: Throwable) { ready = false; false }
              }
              fun down(x: Float, y: Float) = send(MotionEvent.ACTION_DOWN, x, y)
              fun move(x: Float, y: Float) = send(MotionEvent.ACTION_MOVE, x, y)
              fun up(x: Float, y: Float) = send(MotionEvent.ACTION_UP, x, y)
              private fun send(a: Int, x: Float, y: Float) {
                  val m = method ?: return
                  val p = proxy ?: return
                  val n = SystemClock.uptimeMillis()
                  val e = MotionEvent.obtain(n, n, a, x, y, 0)
                  e.source = InputDevice.SOURCE_TOUCHSCREEN
                  try { m.invoke(p, e, 2) } catch (_: Throwable) {}
                  e.recycle()
              }
          }
