              private fun tick() {
                  val c = cap ?: return
                  val cv = canvas
                  val bmp = c.latest()
                  val active = Cfg.enabled && (Cfg.mode == 1 || holdPressed)
                  val inj = AimAccessibilityService.instance?.injector
                  if (!det.ready || bmp == null || (inj == null && !ShizukuInjector.ready)) {
                      Diag.state = if (!det.ready) "modelo no listo" else "sin datos"
