          package com.ovltools.core
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.os.Handler
          import android.os.HandlerThread
          import java.nio.ByteBuffer
          class Capture(private val proj: MediaProjection, private val rw: Int,
                        private val rh: Int, private val density: Int) {
              var scale = 1f; private set
              var w = 2; private set
              var h = 2; private set
              private val th = HandlerThread("cap").apply { start() }
              private val hd = Handler(th.looper)
              private var rd: ImageReader? = null
              private var vd: VirtualDisplay? = null
              @Volatile private var latest: Bitmap? = null
              @Volatile private var busy = false
              fun start(): Boolean {
                  scale = minOf(1f, 640f / maxOf(rw, rh))
                  w = (rw * scale).toInt().coerceAtLeast(2)
                  h = (rh * scale).toInt().coerceAtLeast(2)
                  return try {
                      val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                      rd = r
                      r.setOnImageAvailableListener({ x -> onImage(x) }, hd)
                      vd = proj.createVirtualDisplay("cap", w, h,
                          (density * scale).toInt().coerceAtLeast(72),
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, hd)
                      vd != null
                  } catch (_: Throwable) { false }
              }
              private fun onImage(r: ImageReader) {
                  val img: Image = try { r.acquireLatestImage() } catch (_: Throwable) { return } ?: return
                  try {
                      if (busy) return
                      busy = true
                      toBitmap(img)?.let { b -> latest?.recycle(); latest = b }
                  } catch (_: Throwable) {
                  } finally {
                      try { img.close() } catch (_: Throwable) {}
                      busy = false
                  }
              }
              private fun toBitmap(img: Image): Bitmap? = try {
                  val pl = img.planes[0]
                  val buf: ByteBuffer = pl.buffer
                  val rs = pl.rowStride
                  val rb = w * pl.pixelStride
                  val out = ByteBuffer.allocate(w * h * 4)
                  val row = ByteArray(rs)
                  for (y in 0 until h) {
                      buf.position(y * rs)
                      val n = minOf(rs, buf.remaining())
                      buf.get(row, 0, n)
                      out.put(row, 0, minOf(rb, n))
                      if (n < rb) for (i in 0 until (rb - n)) out.put(0)
                  }
                  out.rewind()
                  val b = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  b.copyPixelsFromBuffer(out); b
              } catch (_: Throwable) { null }
              fun latest(): Bitmap? = latest
              fun stop() {
                  try { vd?.release() } catch (_: Throwable) {}
                  try { rd?.close() } catch (_: Throwable) {}
                  latest?.recycle(); latest = null
                  th.quitSafely()
              }
          }
