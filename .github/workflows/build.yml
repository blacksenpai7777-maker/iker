                  val y = Cfg.anchorFy * height
                  cv.drawCircle(x, y, 11f, p)
                  cv.drawLine(x - 20f, y, x - 6f, y, p)
                  cv.drawLine(x + 6f, y, x + 20f, y, p)
                  cv.drawLine(x, y - 20f, x, y - 6f, p)
                  cv.drawLine(x, y + 6f, x, y + 20f, p)
              }
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          dx = e.x; dy = e.y
                          ox = Cfg.anchorFx * width; oy = Cfg.anchorFy * height
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          Cfg.anchorFx = (ox + e.x - dx).coerceIn(20f, width - 20f) / width
                          Cfg.anchorFy = (oy + e.y - dy).coerceIn(20f, height - 20f) / height
                          invalidate(); return true
                      }
                  }
                  return super.onTouchEvent(e)
              }
          }
