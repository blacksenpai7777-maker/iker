          package com.ovltools.core
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import kotlin.math.hypot
          class GestureInjector(private val svc: AccessibilityService) {
              @Volatile private var busy = false
              private var accX = 0f
              private var accY = 0f
              private var chain = false
              private var last: GestureDescription.StrokeDescription? = null
              private var endX = 0f
              private var endY = 0f
              private var startX = 0f
              private var startY = 0f
              fun setStart(x: Float, y: Float) { startX = x; startY = y; endX = x; endY = y }
              fun queue(dx: Float, dy: Float, ms: Int) {
                  accX += dx; accY += dy
                  if (busy || hypot(accX, accY) < 1.2f) return
                  fire(ms)
              }
              private fun fire(ms: Int) {
                  if (hypot(accX, accY) < 0.8f) return
                  busy = true
                  val cont = chain && last != null
                  val p = Path()
                  if (cont) p.moveTo(endX, endY) else { p.moveTo(startX, startY); endX = startX; endY = startY }
                  endX += accX; endY += accY
                  p.lineTo(endX, endY)
                  accX = 0f; accY = 0f
                  val st = try {
                      if (cont) last!!.continueStroke(p, 0, ms.toLong(), true)
                      else GestureDescription.StrokeDescription(p, 0, ms.toLong(), true)
                  } catch (_: Throwable) { busy = false; chain = false; last = null; return }
                  last = st; chain = true
                  svc.dispatchGesture(GestureDescription.Builder().addStroke(st).build(),
                      object : AccessibilityService.GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) { busy = false }
                          override fun onCancelled(g: GestureDescription?) { busy = false; chain = false; last = null }
                      }, null)
              }
              fun end() {
                  if (!chain || last == null || busy) { chain = false; last = null; return }
                  busy = true
                  val p = Path(); p.moveTo(endX, endY); p.lineTo(endX + 0.6f, endY + 0.6f)
                  val s = try { last!!.continueStroke(p, 0, 16, false) } catch (_: Throwable) {
                      busy = false; chain = false; last = null; return
                  }
                  svc.dispatchGesture(GestureDescription.Builder().addStroke(s).build(),
                      object : AccessibilityService.GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) { busy = false }
                          override fun onCancelled(g: GestureDescription?) { busy = false }
                      }, null)
                  chain = false; last = null
              }
          }
