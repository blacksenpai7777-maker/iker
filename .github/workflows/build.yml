              }
              private val aimLoop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try { tick(); fails = 0 } catch (_: Throwable) {
                          if (++fails > 3) { fails = 0; restart() }
                      }
                      val base = if (thermalLow) 9 else Cfg.fps.coerceIn(5, 30)
                      loop.postDelayed(this, (1000L / base).coerceAtLeast(28L))
                  }
