                  val ay = Cfg.anchorFy * sh
                  val half = (Cfg.fov * s + 26f).toInt()
                  val l = (ax * s - half).toInt().coerceIn(0, (bmp.width - 4).coerceAtLeast(0))
                  val t = (ay * s - half).toInt().coerceIn(0, (bmp.height - 4).coerceAtLeast(0))
                  val r = (ax * s + half).toInt().coerceIn(l + 2, bmp.width)
                  val b = (ay * s + half).toInt().coerceIn(t + 2, bmp.height)
                  val crop: Bitmap = Bitmap.createBitmap(bmp, l, t, r - l, b - t)
                  val dets = try { det.infer(crop, Cfg.conf, (bmp.height * 0.10f).toInt(), (bmp.width * 0.22f).toInt()) }
                              finally { crop.recycle() }
